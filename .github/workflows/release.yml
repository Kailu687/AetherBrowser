name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v0.4.0)
        required: true
        default: v0.4.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (also run on Linux before tagging)
        run: npx vitest run
        continue-on-error: true
      - name: Build installer
        working-directory: apps/desktop
        run: |
          node scripts/build.mjs
          npx electron-builder --win --x64 --publish never
          node scripts/write-manifest.mjs "${{ inputs.tag || github.ref_name }}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AETHER ${{ inputs.tag || github.ref_name }}
          body_path: docs/release-notes.md
          files: |
            apps/desktop/release/AETHER-Setup-*.exe
            apps/desktop/release/latest.json
